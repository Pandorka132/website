<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontroll Mánia!">
  <title>Kontroll Mánia!</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      background: #111318;
    }

    main {
      width: min(90%, 700px);
      padding: 3rem;
      text-align: center;
      border: 1px solid #2d313a;
      border-radius: 20px;
      background: #191c22;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
    }

    p {
      margin: 0 0 2rem;
      color: #aeb4c0;
      font-size: 1.1rem;
    }

    a {
      display: inline-block;
      padding: .8rem 1.2rem;
      border-radius: 10px;
      color: #111318;
      background: #f5f5f5;
      text-decoration: none;
      font-weight: 700;
      transition: transform .15s ease, opacity .15s ease;
    }

    a:hover {
      transform: translateY(-2px);
      opacity: .85;
    }
  </style>
</head>
<body>
  <main>
    <h1>Kontroll Mánia!</h1>
    <p>Egy egyszerű, letisztult kezdőoldal.</p>
    <a href="clock.html">Óra megnyitása</a>
  </main>
</body>
</html>
